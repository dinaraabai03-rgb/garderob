<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мой гардероб</title>
<meta name="theme-color" content="#FBF7D4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Гардероб">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style id="css">
:root{
  --bg:#FBF7D4; --paper:#FFFFFF; --ink:#2E2433; --muted:#6B5F70; --line:#E9E2B4; --field:#FFFFFF;
  --acc:#D4367A; --accd:#B8285F; --on-acc:#FFFFFF; --green:#89A06A; --green-soft:#E3EBD6;
  --pink:#F7E0E8; --sky:#D1EEFE; --lav:#EEDDFF; --warn:#F6E3A3;
  --shadow:rgba(46,36,51,.28);
}
[data-theme=dark]{
  --bg:#1D1722; --paper:#29212F; --ink:#F6EEF6; --muted:#B9AABD; --line:#3D3345; --field:#2F2636;
  --acc:#E0558F; --accd:#F284B2; --on-acc:#FFFFFF; --green:#9DB57E; --green-soft:#2F3A27;
  --pink:#4A2A3A; --sky:#20384A; --lav:#38294C; --warn:#4A3D1C;
  --shadow:rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.h-font{font-family:Unbounded,Manrope,sans-serif;letter-spacing:-.4px}
.app{display:flex;min-height:100vh}
/* sidebar */
.side{width:228px;flex:none;position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--paper);border-radius:0 30px 30px 0;padding:26px 16px 18px;display:flex;flex-direction:column;gap:22px;z-index:30}
.logo{display:flex;align-items:center;gap:10px;padding:0 6px;text-decoration:none;color:var(--ink)}
.logo .mk{width:40px;height:40px;border-radius:14px;background:var(--pink);display:flex;align-items:center;justify-content:center;color:var(--accd);flex:none}
.logo b{font-family:Unbounded,sans-serif;font-weight:700;font-size:16px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;height:46px;padding:0 14px;border-radius:16px;font-size:14.5px;font-weight:700;color:var(--ink);text-decoration:none;white-space:nowrap}
.nav a:hover{background:var(--bg)}
.nav a.on{background:var(--acc);color:var(--on-acc)}
.nav a .n{margin-left:auto;font-size:12px;font-weight:700;opacity:.6}
.side-card{margin-top:auto;background:var(--lav);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:9px}
.side-card .t{font-family:Unbounded,sans-serif;font-size:14px;font-weight:600}
.side-card .s{font-size:12.5px;color:var(--muted)}
.side-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 6px}
.savebar{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;line-height:1.2}
.savebar i{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;flex:none}
.savebar.busy i{background:var(--acc)}
.iconbtn{border:0;background:var(--bg);border-radius:999px;width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink);flex:none}
/* main */
main.main{flex:1;min-width:0;padding:28px 30px 110px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.top .sub{font-size:13.5px;font-weight:600;color:var(--muted)}
.top h1{margin:2px 0 0;font-family:Unbounded,sans-serif;font-size:28px;font-weight:700;letter-spacing:-.5px}
.top .acts{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:8px;background:var(--paper);border-radius:999px;padding:0 16px;height:46px;width:260px;max-width:100%}
.search input{border:0;outline:0;background:transparent;font-size:14px;width:100%}
.btn{border:0;background:var(--ink);color:var(--paper);min-height:46px;padding:0 18px;border-radius:999px;font-weight:800;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;white-space:nowrap}
.btn.acc{background:var(--acc);color:var(--on-acc)}
.btn.green{background:var(--green);color:#2E2433}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ghost:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.sm{min-height:38px;padding:0 14px;font-size:13px}
.btn.danger{background:transparent;color:var(--accd);box-shadow:inset 0 0 0 1.5px var(--pink)}
.btn[disabled]{opacity:.45;cursor:default}
.link{background:transparent;border:0;color:var(--accd);font-weight:800;font-size:13.5px;padding:6px 0;text-decoration:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:0;background:var(--paper);color:var(--ink);min-height:40px;padding:0 15px;border-radius:999px;font-size:13.5px;font-weight:700;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--paper)}
.chip.warn{background:var(--warn)}
.chip .c{opacity:.6;font-weight:600}
.subbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0 18px}
.sel{border:0;background:var(--paper);border-radius:999px;padding:0 14px;min-height:38px;font-size:13px;font-weight:700}
/* grid & cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:14px}
.card{background:var(--paper);border-radius:24px;padding:8px;display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:transform .15s,box-shadow .15s;position:relative}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 24px -14px var(--shadow)}
.card.sel{box-shadow:0 0 0 3px var(--acc)}
.ph{aspect-ratio:4/5;border-radius:18px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:var(--lav)}
.ph img{max-width:84%;max-height:84%;object-fit:contain;border-radius:10px;filter:drop-shadow(0 8px 10px rgba(46,36,51,.16))}
.ph img.cut{border-radius:0}
.ph .sil{width:52%;height:52%;color:var(--muted);opacity:.38}
.badge{position:absolute;top:8px;left:8px;background:var(--paper);color:var(--ink);font-size:11.5px;font-weight:700;border-radius:999px;padding:4px 9px;white-space:nowrap}
.badge-r{position:absolute;top:8px;right:8px}
.cap{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 4px 4px}
.cap .nm{font-weight:700;font-size:14px;line-height:1.25;min-width:0;overflow:hidden;text-overflow:ellipsis}
.cap .nm.todo{color:var(--accd);font-style:italic}
.cap .meta{font-size:12px;color:var(--muted);font-weight:600}
.plus{width:36px;height:36px;flex:none;border-radius:999px;border:0;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.plus.done{background:var(--green);color:#2E2433}
.pill{display:inline-block;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:800;white-space:nowrap}
.p-go{background:var(--green);color:#2E2433}
.p-think{background:var(--warn);color:var(--ink)}
.p-no{background:var(--pink);color:var(--accd)}
.p-new{background:var(--paper);color:var(--muted)}
.p-ink{background:var(--ink);color:var(--paper)}
.empty{border:2px dashed var(--line);border-radius:26px;padding:38px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:Unbounded,sans-serif;font-size:18px;font-weight:600;margin-bottom:8px}
.panel{background:var(--paper);border-radius:26px;padding:18px 20px}
.panel h3,.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px;font-weight:800}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:26px 0 12px;flex-wrap:wrap}
.sec h2{margin:0;font-family:Unbounded,sans-serif;font-size:18px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.stat{border-radius:22px;padding:14px 16px;background:var(--paper)}
.stat .big{font-family:Unbounded,sans-serif;font-size:26px;font-weight:700;line-height:1.1}
.stat .l{color:var(--muted);font-size:12.5px;font-weight:600;margin-top:4px}
.bar{display:grid;grid-template-columns:130px 1fr 28px;gap:10px;align-items:center;margin:7px 0;font-size:13.5px;font-weight:600}
.bar .t{height:10px;background:var(--bg);border-radius:6px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--acc);border-radius:6px}
.bar .v{text-align:right;font-weight:800}
.mini{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);cursor:pointer}
.mini:last-child{border-bottom:0}
.th{width:42px;height:52px;border-radius:12px;overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center}
.th img{max-width:90%;max-height:90%;object-fit:contain}
.th .sil{width:60%;height:60%;color:var(--muted);opacity:.4}
.mini .x{flex:1;min-width:0}
.mini .x div:first-child{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .meta{font-size:12px;color:var(--muted);font-weight:600}
.mini .act{display:flex;gap:6px;flex:none}
.banner{border-radius:18px;padding:12px 16px;font-size:13.5px;margin-bottom:16px;background:var(--warn);font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hint{font-size:12.5px;color:var(--muted);font-weight:600}
/* today / outfits */
.today{background:var(--paper);border-radius:30px;padding:20px 22px;display:flex;flex-direction:column;gap:16px}
.today .hd{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.today .hd .t{font-family:Unbounded,sans-serif;font-size:19px;font-weight:700}
.today .chip{background:var(--bg)}
.today .chip.on{background:var(--ink)}
.look{display:flex;gap:12px;flex-wrap:wrap}
.look .li{width:140px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.look .li .ph{aspect-ratio:4/5}
.look .li b{font-size:13.5px;line-height:1.25}
.look .li span{font-size:12px;color:var(--muted);font-weight:600;margin-top:-4px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wd{background:var(--paper);border-radius:18px;padding:10px;min-height:92px;display:flex;flex-direction:column;gap:7px;cursor:pointer;border:0;text-align:left}
.wd.today{background:var(--pink);box-shadow:inset 0 0 0 2px var(--acc)}
.wd.future{opacity:.55}
.wd .dn{font-size:12px;font-weight:800;color:var(--muted)}
.ths{display:flex;flex-wrap:wrap;gap:4px}
.ths span{width:24px;height:30px;border-radius:7px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.ths span img{max-width:92%;max-height:92%;object-fit:contain}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:12px}
.cal .w{font-size:11.5px;color:var(--muted);text-align:center;font-weight:800}
.cal .d{min-height:70px;padding:6px}
.cal .d.out{visibility:hidden}
.calhead{display:flex;align-items:center;gap:10px}
.calhead .m{font-family:Unbounded,sans-serif;font-size:15px;font-weight:600;min-width:150px;text-align:center}
.collage{aspect-ratio:1/1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:4px;border-radius:18px;overflow:hidden}
.collage>div{display:flex;align-items:center;justify-content:center;overflow:hidden}
.collage>div img{max-width:86%;max-height:86%;object-fit:contain}
.collage .sil{width:50%;height:50%;color:var(--muted);opacity:.4}
.collage.n1{grid-template-columns:1fr;grid-template-rows:1fr}
.collage.n2{grid-template-rows:1fr}
.collage.n3>div:first-child{grid-row:span 2}
/* mannequin figure */
.fig{position:relative;aspect-ratio:3/4;background:var(--lav);border-radius:18px;overflow:hidden;width:100%}
.fig .mq{position:absolute;inset:0;width:100%;height:100%;color:var(--paper);opacity:.7}
.fig .it{position:absolute;display:flex;align-items:center;justify-content:center;cursor:pointer}
.fig .it img{width:100%;height:100%;object-fit:fill;filter:drop-shadow(0 6px 8px rgba(46,36,51,.22));-webkit-user-drag:none;user-select:none}
.fig .it{transform-origin:center}
.fig.flat{background:var(--lav)}
.seg{display:inline-flex;background:var(--paper);border-radius:999px;padding:4px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;min-height:38px;padding:0 14px;font-weight:800;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--paper)}
.fitstage{max-width:300px;margin:0 auto 14px;touch-action:none;user-select:none;-webkit-user-select:none}
.fitstage .it{pointer-events:none}
.fitstage .it.tgt img{filter:drop-shadow(0 0 1.5px var(--acc)) drop-shadow(0 0 1.5px var(--acc)) drop-shadow(0 6px 8px rgba(46,36,51,.22))}
.fitstage .fig{cursor:grab}
.fig .it img.ph-rect{border-radius:8px}
.fig .it .sil{width:100%;height:100%;color:var(--muted);opacity:.55}
.fig .face{position:absolute;left:42.33%;top:4.25%;width:15.33%;height:11.5%;border-radius:50%;overflow:hidden;z-index:9;box-shadow:0 0 0 2px var(--paper)}
.fig .face img{width:100%;height:100%;object-fit:cover;display:block;filter:none;transform-origin:center}
.facebox{display:grid;grid-template-columns:200px minmax(0,1fr);gap:18px;align-items:start}
.range{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;font-size:13px;font-weight:700}
.range input{width:100%;accent-color:var(--acc)}
@media (max-width:700px){.facebox{grid-template-columns:1fr}.facebox .fig{max-width:200px;margin:0 auto}}
.fig.empty-fig::after{content:"Выбери вещи";position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:12.5px;font-weight:700;color:var(--muted)}
.todaywrap{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:700px){.todaywrap{grid-template-columns:1fr}.todaywrap .fig{max-width:260px;margin:0 auto}}
/* trips */
.tripform{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px}
.fld{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.fld>.lb{font-weight:800;font-size:14px;display:flex;gap:10px;align-items:baseline}
.fld>.lb span{font-size:12.5px;color:var(--muted);font-weight:600}
.inp{width:100%;border:0;background:var(--field);border-radius:16px;padding:0 14px;min-height:48px;font-size:15px;font-weight:600;outline:0}
textarea.inp{padding:12px 14px;min-height:70px;resize:vertical;font-weight:500}
select.inp{appearance:auto}
.wdesc{background:var(--sky);border-radius:16px;padding:11px 14px;font-size:13.5px;display:flex;gap:8px;align-items:flex-start}
.lug{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lug button{border:0;border-radius:22px;padding:14px;min-height:100px;text-align:left;background:var(--paper);box-shadow:inset 0 0 0 1.5px var(--line);display:flex;flex-direction:column;gap:5px;color:var(--ink)}
.lug button.on{background:var(--ink);color:var(--paper);box-shadow:none}
.lug b{font-size:14.5px}
.lug span{font-size:12px;opacity:.75}
.dayrow{background:var(--paper);border-radius:18px;padding:8px 8px 8px 14px;display:flex;flex-direction:column;gap:8px}
.dayrow .r{display:flex;align-items:center;gap:10px}
.dayrow .d{font-weight:800;font-size:13.5px;width:58px;flex:none}
.dayrow .acts{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.tag{font-size:12.5px;font-weight:700;border-radius:999px;padding:6px 11px;background:var(--lav);border:0;color:var(--ink)}
.tag.off{background:var(--bg);color:var(--muted)}
.trip-wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.capsule{background:var(--paper);border-radius:26px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.capsule .row{display:flex;gap:8px;flex-wrap:wrap}
.tile{width:66px;height:80px;border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;flex:none}
.tile img{max-width:88%;max-height:88%;object-fit:contain}
.tile .sil{width:56%;height:56%;color:var(--muted);opacity:.45}
.tile.s{width:50px;height:62px;border-radius:12px}
.lugbar{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:800}
.lugbar .t{width:110px;height:8px;border-radius:6px;background:var(--bg);overflow:hidden;display:inline-block}
.lugbar .t i{display:block;height:100%;background:var(--green)}
.lugbar .t i.over{background:var(--acc)}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.daycard{background:var(--paper);border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:10px}
.daycard .h b{font-size:14px;display:block}
.daycard .h span{font-size:12.5px;color:var(--muted);font-weight:600}
.pack{background:var(--paper);border-radius:26px;padding:20px 18px;display:flex;flex-direction:column;gap:12px;position:sticky;top:16px}
.ck{display:flex;align-items:center;gap:10px;min-height:38px;font-size:13.5px;font-weight:600;cursor:pointer;border:0;background:transparent;padding:0;text-align:left;width:100%;color:var(--ink)}
.ck .bx{width:22px;height:22px;border-radius:7px;flex:none;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 2px var(--line)}
.ck.done{color:var(--muted);text-decoration:line-through}
.ck.done .bx{background:var(--green);box-shadow:none;color:#2E2433}
.ck .why{font-size:11.5px;color:var(--accd);font-weight:800;margin-left:auto;text-decoration:none}
.miss{background:var(--pink);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.miss b{font-size:13.5px}
.tripcard{background:var(--paper);border-radius:26px;padding:18px;display:flex;flex-direction:column;gap:10px;cursor:pointer}
.tripcard .t{font-family:Unbounded,sans-serif;font-size:18px;font-weight:700}
.prog{height:6px;background:var(--bg);border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--green)}
/* declutter */
.dq{text-align:center}
.dq .ph{max-width:260px;margin:0 auto 12px}
.dq .facts{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.dbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.progress{height:6px;background:var(--bg);border-radius:6px;overflow:hidden;margin:6px 0 14px}
.progress i{display:block;height:100%;background:var(--green)}
/* modal & sheet */
.ov{position:fixed;inset:0;background:rgba(30,22,34,.38);display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow-y:auto;z-index:60}
.modal{background:var(--paper);border-radius:28px;width:100%;max-width:640px;padding:22px 22px 18px;box-shadow:0 30px 60px -20px rgba(0,0,0,.45)}
.modal .mh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.modal .mh h2{margin:0;font-family:Unbounded,sans-serif;font-size:20px;font-weight:700}
.modal .mh .k{font-size:12.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
@media (min-width:900px){
  .ov.sheet{justify-content:flex-end;padding:0;overflow:hidden}
  .ov.sheet .modal{max-width:420px;height:100vh;border-radius:30px 0 0 30px;overflow-y:auto;padding:22px 22px 24px}
}
.f{margin-bottom:14px}
.f .lb{display:block;font-weight:800;font-size:13px;margin-bottom:6px}
.modal .inp{background:var(--bg)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.photo-drop{display:flex;gap:14px;align-items:center}
.photo-drop .prev{width:90px;height:112px;border-radius:16px;overflow:hidden;display:flex;align-items:center;justify-content:center;flex:none}
.photo-drop .prev img{max-width:88%;max-height:88%;object-fit:contain}
.photo-drop .prev .sil{width:55%;height:55%;color:var(--muted);opacity:.45}
.sw{display:flex;gap:7px;flex-wrap:wrap}

.sw button.on{border-color:var(--paper);outline:2px solid var(--ink)}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{border:0;background:var(--bg);border-radius:999px;padding:0 14px;min-height:38px;font-size:13.5px;font-weight:700;color:var(--ink)}
.opt.on{background:var(--ink);color:var(--paper)}
.opt.on.good{background:var(--green);color:#2E2433}
.opt.on.bad{background:var(--acc);color:var(--on-acc)}
.opt.on.mid{background:var(--warn);color:var(--ink)}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:8px;max-height:300px;overflow-y:auto;padding:2px}
.pick button{border:2px solid transparent;border-radius:14px;padding:0;aspect-ratio:4/5;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center}
.pick button img{max-width:88%;max-height:80%;object-fit:contain}
.pick button .sil{width:50%;height:50%;color:var(--muted);opacity:.45}
.pick button span{position:absolute;bottom:0;left:0;right:0;background:var(--paper);font-size:10px;line-height:1.2;padding:2px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.pick button.on{border-color:var(--acc)}
.pick button.on::after{content:"✓";position:absolute;top:3px;right:3px;background:var(--acc);color:#fff;width:18px;height:18px;border-radius:50%;font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:800}
.pickcat{font-size:11.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:8px 0 2px;grid-column:1/-1}
.bigph{aspect-ratio:1/1;max-height:260px;width:100%;border-radius:22px}
.bigph img{max-width:80%;max-height:80%}
.mstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mstats div{border-radius:18px;padding:12px 12px}
.mstats b{font-family:Unbounded,sans-serif;font-size:17px;display:block}
.mstats span{font-size:12px;color:var(--muted);font-weight:700}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tags span{background:var(--bg);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700}
.verdict{border-radius:20px;padding:14px 16px;margin:6px 0 14px;display:flex;gap:14px;align-items:center}
.verdict .vt{font-family:Unbounded,sans-serif;font-size:18px;font-weight:700}
.verdict .vs{font-size:13px}
.v-go{background:var(--green-soft)} .v-think{background:var(--warn)} .v-no{background:var(--pink)}
.reasons{font-size:13px;margin:0 0 14px;padding-left:18px;color:var(--muted);font-weight:600}
.ft{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px;margin-top:8px}
.ft .r{display:flex;gap:8px;flex-wrap:wrap}
details.more{margin-bottom:14px;background:var(--bg);border-radius:18px;padding:12px 14px}
details.more summary{cursor:pointer;font-weight:800;font-size:13.5px}
details.more[open] summary{margin-bottom:12px}
details.more .inp{background:var(--paper)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:999px;font-size:13.5px;font-weight:700;z-index:90;box-shadow:0 10px 30px -10px rgba(0,0,0,.4);max-width:90vw;text-align:center}
svg{flex:none}

/* ---------- wear logging ---------- */
function logWear(ids,day){

  if(!L.length)delete S.log[day];
}
function unlogWear(id,day){
  var L=S.log[day];if(!L)return;var k=L.indexOf(id);if(k<0)return;L.splice(k,1);if(!L.length)delete S.log[day];
  var it=byId(id);if(!it)return;it.wears=Math.max(0,(it.wears||0)-1);

  skip=skip||[];

    function st(i){var d=daysSince(i.lastWorn||i.added)||0;return (i.wears?0:1000)+d}
    return st(b)-st(a);
  });
}

function importJson(file){

  if(a==="wear-outfit"){var o2=cleanDraft();if(!o2.name)o2.name=autoName(o2.items);upsert(S.outfits,o2);closeModal();wearOutfit(o2.id);return}
  if(a==="sug-again"){SUG.res=suggest(SUG.occ,SUG.res&&SUG.res.outfit);render();return}
  if(a==="sug-wear"){var r=SUG.res;if(r.outfit)wearOutfit(r.outfit);else{logWear(r.items);commit();toast("Хорошего дня!")}return}
  if(a==="sug-save"){openOutfit(null,SUG.res.items.slice());return}
  if(a==="save-day"){var dy=draft.day,sel=draft.sel,orig2=draft.orig;
    orig2.forEach(function(id){if(sel.indexOf(id)<0)unlogWear(id,dy)});
    logWear(sel.filter(function(id){return orig2.indexOf(id)<0}),dy);
    if(draft.outfit){var ow=S.outfits.find(function(x){return x.id===draft.outfit});if(ow&&ow.items.every(function(id){return sel.indexOf(id)>=0||!byId(id)||byId(id).gone})){ow.wears=(ow.wears||0)+1;if(!ow.lastWorn||ow.lastWorn<dy)ow.lastWorn=dy}}
    closeModal();commit();return}
  if(a==="save-tripday"){var tr=tripById(draft.trip);if(tr){tr.plan=tr.plan||{};tr.plan[draft.day]=draft.sel.slice();syncCapsule(tr)}closeModal();commit();return}
  if(a==="dq"){openModal("dq",{});return}
  if(a==="dq-skipped"){draft.skip=[];drawModal();return}
  if(a==="dq-reset"){if(!t.dataset.sure){t.dataset.sure="1";t.textContent="Сбросить все решения?";return}active().forEach(function(i){i.decision=""});commit();return}
  // trips
  if(a==="trip-new"){var st0=new Date();st0.setDate(st0.getDate()+7);var en0=new Date(st0);en0.setDate(st0.getDate()+3);TD={name:"",start:iso(st0),end:iso(en0),weather:[],style:"relaxed",lug:"carry",days:{},_open:null};render();window.scrollTo(0,0);return}
  if(a==="trip-cancel"){TD=null;render();if(dirty)flushSoon();return}
  if(a==="trip-repeat"){var src=TD.days[ds.day]||[];tripDays(TD.start,TD.end).forEach(function(x){if(!(TD.days[x]||[]).length)TD.days[x]=src.slice()});render();return}
  if(a==="trip-edit"){var tt=tripById(ui.tripId);if(!tt)return;var dm={};(tt.days||[]).forEach(function(x){dm[x.date]=(x.acts||[]).slice()});TD={_editing:tt.id,name:tt.name,start:tt.start,end:tt.end,weather:(tt.weather||[]).slice(),style:tt.style||"",lug:tt.lug||"carry",days:dm,_open:null};render();window.scrollTo(0,0);return}
  if(a==="trip-build"){
    var dl=tripDays(TD.start,TD.end);if(!dl.length)return;
    var trip=TD._editing?tripById(TD._editing):null;
    if(!trip){trip={id:uid(),created:today(),status:"planned",pack:{},forget:[]};S.trips.push(trip)}
    trip.name=(TD.name||"").trim()||"Поездка";trip.start=dl[0];trip.end=dl[dl.length-1];trip.weather=TD.weather.slice();trip.style=TD.style;trip.lug=TD.lug;
    trip.days=dl.map(function(x){return {date:x,acts:(TD.days[x]||[]).slice()}});
    buildCapsule(trip);ui.tripId=trip.id;keepUi();TD=null;commit();window.scrollTo(0,0);toast("Капсула собрана: "+things(trip.capsule.length));return}
  if(a==="trip-rebuild"){var tb=tripById(ui.tripId);if(tb){buildCapsule(tb);commit();toast("Пересобрала: "+things(tb.capsule.length))}return}
  if(a==="trip-done"){var td2=tripById(ui.tripId);if(!td2)return;var tdy=today(),n=0;Object.keys(td2.plan||{}).forEach(function(dk){if(dk<=tdy&&(td2.plan[dk]||[]).length){logWear(td2.plan[dk],dk);n++}});td2.status="done";commit();toast("Записала в календарь: "+dd(n));return}
  if(a==="trip-del"){if(!t.dataset.sure){t.dataset.sure="1";t.textContent="Точно удалить поездку?";return}S.trips=S.trips.filter(function(x){return x.id!==ui.tripId});ui.tripId=null;keepUi();commit();return}
});
function flushSoon(){clearTimeout(saveTimer);saveTimer=setTimeout(flush,LOCAL||PWA?300:900)}
function autoName(ids){var its=ids.map(byId).filter(Boolean);return its.slice(0,2).map(iname).join(" + ")+(its.length>2?" …":"")||"Образ"}
function wearOutfit(id){
  var o=S.outfits.find(function(x){return x.id===id});if(!o)return;
  var t=today();if(o.lastWorn===t){toast("Этот образ уже отмечен сегодня");return}
  logWear(o.items.filter(function(i){var x=byId(i);return x&&!x.gone}));o.wears=(o.wears||0)+1;o.lastWorn=t;commit();toast("«"+(o.name||"Образ")+"» — "+times(o.wears));
}
document.addEventListener("submit",function(ev){
  var f=ev.target;if(!f.dataset||f.dataset.form!=="forget")return;ev.preventDefault();
  var v=(f.t.value||"").trim(),tr=ui.tripId?tripById(ui.tripId):null;if(!v||!tr)return;
  tr.forget=tr.forget||[];tr.forget.push({t:v,done:false});commit();
});
document.addEventListener("input",function(ev){
  var t=ev.target;
  if(t.id==="q"){ui.q=t.value;keepUi();var pos=t.selectionStart;render();var q=$("#q");if(q){q.focus();try{q.setSelectionRange(pos,pos)}catch(e){}}return}
  if(TD&&t.dataset.tf==="name"){TD.name=t.value;return}
  if(draft&&mode==="fit"&&t.dataset.fit){draft.fit[t.dataset.fit]=Number(t.value);fitApply();return}
  if(draft&&mode==="face"&&t.dataset.fa){draft.adj[t.dataset.fa]=Number(t.value);var fi=$(".modal .face img");if(fi){var keep=S.faceAdj;S.faceAdj=draft.adj;fi.setAttribute("style",faceTf());S.faceAdj=keep}return}
  if(draft&&t.dataset.f&&t.dataset.f!=="cat"){var v=t.value;if(t.dataset.f==="wears")v=Math.max(0,parseInt(v)||0);setPath(draft,t.dataset.f,v)}
});
document.addEventListener("change",function(ev){
  var t=ev.target;
  if(t.dataset.ui){ui[t.dataset.ui]=t.value;keepUi();render();return}
  if(TD&&(t.dataset.tf==="start"||t.dataset.tf==="end")){TD[t.dataset.tf]=t.value;if(t.dataset.tf==="start"&&(!TD.end||TD.end<TD.start))TD.end=TD.start;render();return}
  if(draft&&t.dataset.f==="cat"){draft.cat=t.value;if(mode==="wish"&&draft.check&&draft.check.pairs){draft.check.pairs=draft.check.pairs.filter(function(id){var i=byId(id);return i&&i.cat!==draft.cat})}drawModal();return}
  if(draft&&t.id==="ph"&&t.files&&t.files[0]){
    var prev=$(".photo-drop .prev");if(prev)prev.innerHTML='<span class="hint">…</span>';
    processPhoto(t.files[0]).then(function(r){if(draft){draft.photo=r.url;draft.cut=r.cut;draft.ar=r.ar;draft.bb=r.bb;delete draft.fit;drawModal()}}).catch(function(){toast("Не получилось загрузить фото");if(draft)drawModal()});
    return;
  }
  if(draft&&mode==="face"&&t.id==="facefile"&&t.files&&t.files[0]){
    processPhoto(t.files[0]).then(function(r){if(draft&&mode==="face"){draft.face=r.url;draft.adj={z:1,x:0,y:0};drawModal()}}).catch(function(){toast("Не получилось загрузить фото")});return}
  if(t.id==="bulk"&&t.files&&t.files.length){
    var files=Array.prototype.slice.call(t.files),n=0,catK=ui.cat!=="all"?ui.cat:"other";
    toast("Загружаю фото: 0 из "+files.length);
    files.reduce(function(p,f){return p.then(function(){return processPhoto(f).then(function(r){
      S.items.push({id:uid(),name:"",cat:catK,color:"",seasons:[],occ:[],photo:r.url,cut:r.cut,ar:r.ar,bb:r.bb,wears:0,lastWorn:"",added:today(),notes:"",price:"",needsInfo:true});n++;toast("Загружаю фото: "+n+" из "+files.length);
    }).catch(function(){})})},Promise.resolve()).then(function(){ui.todo=true;keepUi();commit();toast("Добавлено "+things(n)+" — заполни описания")});
    return;
  }
  if(t.id==="import"&&t.files&&t.files[0]){importJson(t.files[0]);return}
});
var PTR={};
document.addEventListener("pointerdown",function(ev){
  if(!(draft&&mode==="fit"))return;var st=ev.target.closest(".fitstage");if(!st)return;
  ev.preventDefault();try{st.setPointerCapture(ev.pointerId)}catch(e){}
  var fig=st.querySelector(".fig"),r=fig.getBoundingClientRect();
  PTR[ev.pointerId]={x:ev.clientX,y:ev.clientY};PTR._k=300/r.width;
  var ids=Object.keys(PTR).filter(function(k){return k.charAt(0)!=="_"});
  if(ids.length===2){var a=PTR[ids[0]],b=PTR[ids[1]];PTR._d0=Math.hypot(a.x-b.x,a.y-b.y);PTR._s0=draft.fit.s||1}
});
document.addEventListener("pointermove",function(ev){
  if(!(draft&&mode==="fit")||!PTR[ev.pointerId])return;ev.preventDefault();
  var ids=Object.keys(PTR).filter(function(k){return k.charAt(0)!=="_"}),prev=PTR[ev.pointerId];
  if(ids.length===1){draft.fit.dx=(draft.fit.dx||0)+(ev.clientX-prev.x)*PTR._k;draft.fit.dy=(draft.fit.dy||0)+(ev.clientY-prev.y)*PTR._k*1}
  PTR[ev.pointerId]={x:ev.clientX,y:ev.clientY};
  if(ids.length===2&&PTR._d0){var a=PTR[ids[0]],b=PTR[ids[1]];draft.fit.s=Math.max(.4,Math.min(2.5,PTR._s0*Math.hypot(a.x-b.x,a.y-b.y)/PTR._d0));var sl=document.querySelector('[data-fit="s"]');if(sl)sl.value=draft.fit.s}
  fitApply();
},{passive:false});
function ptrEnd(ev){if(PTR[ev.pointerId]){delete PTR[ev.pointerId];delete PTR._d0}}
document.addEventListener("pointerup",ptrEnd);document.addEventListener("pointercancel",ptrEnd);
document.addEventListener("keydown",function(ev){if(ev.key==="Escape"&&draft){closeModal();if(dirty)flushSoon()}});
window.addEventListener("hashchange",function(){if(tab()!=="trips"){TD=null}render();window.scrollTo(0,0)});
window.addEventListener("pagehide",function(){if(LOCAL&&dirty){try{fetch("/api/data",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(S),keepalive:true})}catch(e){}}});

render();
boot();
})();
</script>
</body>
